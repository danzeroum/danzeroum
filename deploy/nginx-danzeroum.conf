# ============================================================
# Exemplo de server block nginx para o site Danzeroum.
# Copie para /etc/nginx/sites-available/danzeroum.com e ative com:
#   sudo ln -s /etc/nginx/sites-available/danzeroum.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Ajuste o caminho do socket do PHP-FPM (veja: ls /run/php/).
# Para HTTPS, rode: sudo certbot --nginx -d danzeroum.com -d www.danzeroum.com
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name danzeroum.com www.danzeroum.com;

    root /var/www/danzeroum.com/public_html;
    index index.html;

    error_page 404 /404.html;

    # Arquivos estáticos / SPA-less: tenta o arquivo, senão 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Processa o formulário PHP
    location = /contato.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # ajuste a versão do PHP
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloqueia QUALQUER outro .php (só contato.php é permitido)
    location ~ \.php$ { return 404; }

    # Bloqueia arquivos sensíveis
    location ~ /\.(git|ht) { deny all; }
    location ~ \.example\.php$ { deny all; }

    # Cache de assets
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
