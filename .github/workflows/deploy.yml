name: Deploy para o VPS (Docker)

# A cada push no main, atualiza o projeto no VPS e sobe os containers.
# O site roda como serviço Docker em /opt/btv/danzeroum, atrás do ingress.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Carrega a chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Confia no host (known_hosts)
        run: |
          mkdir -p ~/.ssh
          PORT="${{ secrets.SSH_PORT }}"
          ssh-keyscan -p "${PORT:-22}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: git pull + docker compose up no VPS
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          ssh -p "${SSH_PORT:-22}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; cd \"${APP_DIR:-/opt/btv/danzeroum}\" && \
             git pull --ff-only && \
             docker compose up -d --remove-orphans && \
             docker compose ps"
