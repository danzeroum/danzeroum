name: Deploy para o VPS Hostinger

# Publica o site no VPS a cada push no main (e manualmente via "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Não deixa dois deploys rodarem ao mesmo tempo.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Carrega a chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Confia no host (known_hosts)
        run: |
          mkdir -p ~/.ssh
          PORT="${{ secrets.SSH_PORT }}"
          ssh-keyscan -p "${PORT:-22}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Envia o site via rsync
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='deploy' \
            --exclude='smtp-config.example.php' \
            -e "ssh -p ${SSH_PORT:-22}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"
