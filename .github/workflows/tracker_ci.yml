name: Tracker — CI

# Testa o subprojeto tracker/ (rastreador de licitações). Não faz deploy.
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'tracker/**'
      - '.github/workflows/tracker_ci.yml'
  pull_request:
    paths:
      - 'tracker/**'
      - '.github/workflows/tracker_ci.yml'

concurrency:
  group: tracker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: danzeroum
          POSTGRES_PASSWORD: danzeroum
          POSTGRES_DB: oportunidades
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U danzeroum -d oportunidades"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://danzeroum:danzeroum@localhost:5432/oportunidades

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Aplica o schema no Postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/schema.sql

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (unitários + integração)
        run: pytest -q
