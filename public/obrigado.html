<script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}}catch(e){}})();</script>
<style>
:root{--bg:#fbf7f1;--ink:#231a14;--muted:#7a6a5b;--brand:#bd4e1c;--brand-ink:#b3470f;--on-brand:#fff8f1;--line-2:#d3c4ae}
html.dark{--bg:#141009;--ink:#f6ede1;--muted:#a8957f;--brand:#e8772f;--brand-ink:#f0934d;--on-brand:#1a1106;--line-2:#41331f}
*{margin:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--muted);min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;line-height:1.65}
.ico{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;margin:0 auto 20px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand-ink)}
.ico svg{width:30px;height:30px}
h1{font-size:clamp(1.5rem,4vw,2.1rem);color:var(--ink);font-weight:600;letter-spacing:-.02em;margin-bottom:14px;max-width:18ch}
p{max-width:46ch;margin-inline:auto}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:.95rem;padding:13px 22px;border-radius:10px;border:1px solid transparent;transition:transform .12s,background .18s,border-color .18s}
.btn svg{width:18px;height:18px}
.btn:hover{transform:translateY(-2px)}
.btn-wa{background:#25d366;color:#0a2e14}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
</style>
</head>
<body>
  <div>
    <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
    <h1>Mensagem recebida. Obrigado!</h1>
    <p>Já recebi seu contato e respondo o quanto antes. Se preferir adiantar, é só chamar no WhatsApp.</p>
    <div class="cta">
      <a class="btn btn-wa" href="https://wa.me/5511996685998?text=Ol%C3%A1%2C%20acabei%20de%20enviar%20o%20formul%C3%A1rio%20no%20danzeroum.com." target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.3 5.2 4.6.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.4zM12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2z"/></svg>
        Falar no WhatsApp
      </a>
      <a class="btn btn-ghost" href="/">Voltar ao início</a>
    </div>
  </div>
</body>
</html>
