<style>
:root{--bg:#fbf7f1;--ink:#231a14;--muted:#7a6a5b;--brand:#bd4e1c;--brand-ink:#b3470f;--on-brand:#fff8f1}
html.dark{--bg:#141009;--ink:#f6ede1;--muted:#a8957f;--brand:#e8772f;--brand-ink:#f0934d;--on-brand:#1a1106}
*{margin:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--muted);min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;line-height:1.6}
.big{font-family:'IBM Plex Mono',monospace;font-size:clamp(3rem,12vw,6rem);font-weight:600;color:var(--brand);line-height:1}
h1{font-size:clamp(1.4rem,4vw,2rem);color:var(--ink);font-weight:600;letter-spacing:-.02em;margin:8px 0 14px;max-width:20ch}
p{max-width:46ch;margin-inline:auto}
