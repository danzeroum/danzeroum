# nginx do container danzeroum-frontend — serve o site estático e o formulário PHP.
# O ingress (/opt/btv/ingress) faz proxy_pass http://danzeroum-frontend:80 para cá.
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    error_page 404 /404.html;

    # Páginas e assets estáticos
    location / {
        try_files $uri $uri/ =404;
    }

    # Só o contato.php é processado pelo PHP-FPM
    location = /contato.php {
        include fastcgi_params;
        fastcgi_pass danzeroum-php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Qualquer outro .php é bloqueado (não expõe código PHP)
    location ~ \.php$ { return 404; }

    # Não servir o diretório da lib nem arquivos ocultos
    location ^~ /lib/ { return 404; }
    location ~ /\. { return 404; }

    # Cache dos assets com nome estável
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
