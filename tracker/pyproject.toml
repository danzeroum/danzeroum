[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danzeroum-tracker"
version = "0.1.0"
description = "Rastreador de oportunidades públicas (licitações) da Danzeroum — V1"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "jsonschema>=4.20",
    "psycopg[binary]>=3.1",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
danzeroum-tracker = "danzeroum_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["danzeroum_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testes que exigem um PostgreSQL real (variável DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fixtures de HTML em testes têm linhas longas legítimas.
"tests/**" = ["E501"]
