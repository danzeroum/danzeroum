# Stack ISOLADO do rastreador — separado do docker-compose.yml do site (raiz).
# Sobe um PostgreSQL e o coletor em loop de baixa frequência (poucos acessos/dia).
#
#   cd tracker && cp .env.example .env && docker compose up -d --build
#
name: danzeroum-tracker
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-danzeroum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-danzeroum}
      POSTGRES_DB: ${POSTGRES_DB:-oportunidades}
    volumes:
      - tracker_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-danzeroum} -d ${POSTGRES_DB:-oportunidades}"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-danzeroum}:${POSTGRES_PASSWORD:-danzeroum}@db:5432/${POSTGRES_DB:-oportunidades}
      TRACKER_UF: ${TRACKER_UF:-SP}
      TRACKER_KEYWORDS: ${TRACKER_KEYWORDS:-}
      TRACKER_SCORER: ${TRACKER_SCORER:-heuristic}
      # LLM (DeepSeek) — opt-in. Vazio = scorer 'llm' cai no heurístico.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      TRACKER_LLM_MAX_CHARS: ${TRACKER_LLM_MAX_CHARS:-}
      TRACKER_SOURCES: ${TRACKER_SOURCES:-pncp}
      TRACKER_MODALIDADES: ${TRACKER_MODALIDADES:-6,8}
      TRACKER_PROPOSAL_HORIZON_DAYS: ${TRACKER_PROPOSAL_HORIZON_DAYS:-365}
      COLLECT_INTERVAL_HOURS: ${COLLECT_INTERVAL_HOURS:-24}
      TRACKER_MIN_FIT: ${TRACKER_MIN_FIT:-0.4}
      # Calibração de endpoint/paginação (vazio = default do app). Ajuste no .env
      # se a API mudar de caminho/host na primeira execução real.
      PNCP_BASE_URL: ${PNCP_BASE_URL:-}
      COMPRAS_GOV_BASE_URL: ${COMPRAS_GOV_BASE_URL:-}
      COMPRAS_SP_BASE_URL: ${COMPRAS_SP_BASE_URL:-}
      PREF_SP_BASE_URL: ${PREF_SP_BASE_URL:-}
      TRACKER_PAGE_SIZE: ${TRACKER_PAGE_SIZE:-}
      TRACKER_MAX_PAGES: ${TRACKER_MAX_PAGES:-}
      TRACKER_REQUEST_TIMEOUT: ${TRACKER_REQUEST_TIMEOUT:-}
      # Alertas por e-mail (opt-in). Vazio = no-op. SMTP_PORT tem default p/ não quebrar.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-ssl}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Rastreador Danzeroum}
      MAIL_TO: ${MAIL_TO:-}
      # Telegram (alertas multicanal, opt-in). Vazio = no-op.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    command: ["schedule"]

volumes:
  tracker_pgdata:
